name: Arrangement editor
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'tools/vocal_annotation_tool/**'
      - 'Source/web/**'
      - 'Source/uikit/**'
      - 'Source/editor_ui/**'
      - 'CMakeLists.txt'
      - '.github/workflows/arrangement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run check
        working-directory: frontend
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI and audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb openbox x11-utils
      - name: Configure
        run: cmake -S . -B build-arrangement -DCMAKE_BUILD_TYPE=Release -DSYNTHETIC_OBSIDIAN_BUILD_NATIVE_ANNOTATOR=OFF -DSYNTHETIC_OBSIDIAN_ARRANGEMENT_TESTS=ON
      - name: Build
        run: cmake --build build-arrangement --config Release --target ArrangementTests NativeStudioTests VocalAnnotationTool --parallel 3
      - name: Verify playback, project round-trip and native UI
        if: runner.os != 'Linux'
        run: ctest --test-dir build-arrangement/vocal_annotation_tool_build -C Release -R "ArrangementTests|NativeStudioTests" --output-on-failure
      - name: Verify Linux playback and native UI
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1920x1200x24' bash tools/uikit_demo/run-x11.sh ctest --test-dir build-arrangement/vocal_annotation_tool_build -C Release -R "ArrangementTests|NativeStudioTests" --output-on-failure
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-studio-${{ matrix.os }}
          path: build-arrangement/Testing/Temporary/LastTest.log
