<defs><linearGradient id="tile" x1="176" y1="64" x2="800" y2="960" gradientUnits="userSpaceOnUse"><stop stop-color="#343F43"/><stop offset="0.5" stop-color="#1A2328"/><stop offset="1" stop-color="#0B1119"/></linearGradient>
